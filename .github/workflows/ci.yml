name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install checksum-verified static tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/static-tools"
          cd "$RUNNER_TEMP/static-tools"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          printf '%s  %s\n' '6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87' shellcheck.tar.xz | sha256sum --check --status
          tar -xJf shellcheck.tar.xz shellcheck-v0.10.0/shellcheck
          install -m 0755 shellcheck-v0.10.0/shellcheck "$RUNNER_TEMP/static-tools/shellcheck"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          printf '%s  %s\n' '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c' gitleaks.tar.gz | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
          chmod 0755 gitleaks
          echo "$RUNNER_TEMP/static-tools" >> "$GITHUB_PATH"

      - name: bash -n on every shell script
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -print0)

      - name: ShellCheck every shell script
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            shellcheck -s bash "$script"
          done < <(find . -type f -name '*.sh' -print0)

      - name: SSH workflow functional tests
        run: bash 01-configuration-serveur/bin/tests/test_ssh_workflow.sh

      - name: Locale tests
        run: bash 01-configuration-serveur/bin/tests/test_locale.sh

      - name: Existing Python syntax and unit tests
        run: |
          python3 -m unittest discover -s 01-preparation-utilisateur/tests -v
          python3 -m compileall -q 03-environnement-de-developpement
          (cd 03-environnement-de-developpement && python3 -m unittest discover -s tests -v)

      - name: Existing Python lint and type checking
        run: |
          python3 -m venv "$RUNNER_TEMP/python-gates"
          "$RUNNER_TEMP/python-gates/bin/python" -m pip install 'ruff==0.13.3' 'mypy==1.18.2'
          "$RUNNER_TEMP/python-gates/bin/ruff" check --select E4,E7,E9,F 03-environnement-de-developpement
          "$RUNNER_TEMP/python-gates/bin/mypy" --follow-imports=silent --ignore-missing-imports 03-environnement-de-developpement/install_dev_environment.py

      - name: Documentation and architecture consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import unquote

          docs = list(Path('.').rglob('*.md'))
          for doc in docs:
              text = doc.read_text(encoding='utf-8')
              fences = [line for line in text.splitlines() if line.startswith('```')]
              assert len(fences) % 2 == 0, f'{doc}: unclosed code fence'
              for dest in re.findall(r'(?<!!)\[[^]]+\]\(([^)]+)\)', text):
                  target = unquote(dest.split('#', 1)[0])
                  if target and not re.match(r'^[a-z]+://', target):
                      assert (doc.parent / target).exists(), f'{doc}: broken link {dest}'
              for script in re.findall(r'(?<![\w.-])((?:\.?\.?/)?[A-Za-z0-9_./-]+\.sh)\b', text):
                  if script.startswith('/') or '/' not in script:
                      continue
                  if script.startswith('./'):
                      candidate = (Path('.') / script[2:]).resolve()
                  else:
                      candidate = (doc.parent / script).resolve()
                  assert candidate.exists(), f'{doc}: referenced shell script does not exist: {script}'
          PY
          legacy_function='validate_initial_''key_path'
          legacy_bootstrap='ubuntu-dev-''bootstrap'
          legacy_monolith='serveur-bootstrap-''complet'
          ! grep -R -n --exclude-dir=.git --exclude='test_ssh_workflow.sh' --exclude='ci.yml' -F \
            -e "$legacy_function" -e "$legacy_bootstrap" -e "$legacy_monolith" .
          test -x 01-configuration-serveur/bin/ssh-workflow.sh
          test -x 01-configuration-serveur/bin/tests/test_ssh_workflow.sh
          test -x 01-configuration-serveur/bin/tests/test_locale.sh

      - name: Secret scan of working tree
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gitleaks-ci.toml" <<'TOML'
          [extend]
          useDefault = true
          [allowlist]
          description = "Synthetic GPG subkey fingerprint fixture only"
          regexes = ['''^7F38BBB59D064DBCB3D84D725612B36462313325$''']
          TOML
          gitleaks dir . --no-banner --redact --config "$RUNNER_TEMP/gitleaks-ci.toml"
